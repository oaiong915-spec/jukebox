<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BGM 주크박스</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2563eb;--blue-dark:#1e40af;--blue-light:#dbeafe;
  --bg:#ffffff;--text:#0f172a;--text-sec:#64748b;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;}
body{font-family:'Noto Sans KR',sans-serif;background:linear-gradient(135deg,#ffffff 0%,#f0f9ff 100%);color:var(--text);overflow-x:hidden;}

.app{width:100%;min-height:100vh;display:flex;flex-direction:column;position:relative;}

/* Background Pattern */
.pattern-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;overflow:hidden;pointer-events:none;}
.pattern-bg svg{width:100%;height:100%;opacity:0.03;}

/* Header with geometric design */
.header{position:relative;z-index:1;background:linear-gradient(135deg,#2563eb 0%,#1e40af 100%);color:#fff;padding:4rem 2rem;text-align:center;clip-path:polygon(0 0,100% 0,100% 85%,0 100%);overflow:hidden;}
.header::before{content:'';position:absolute;top:-50%;right:-10%;width:500px;height:500px;background:rgba(255,255,255,0.1);border-radius:50%;animation:float 20s infinite ease-in-out;}
.header::after{content:'';position:absolute;bottom:-30%;left:5%;width:400px;height:400px;background:rgba(255,255,255,0.05);border-radius:50%;animation:float 25s infinite ease-in-out reverse;}
@keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-30px)}}

.logo{font-size:48px;font-weight:700;letter-spacing:-2px;margin-bottom:8px;position:relative;z-index:1;font-family:'Space Mono',monospace;}
.subtitle{font-size:13px;letter-spacing:3px;text-transform:uppercase;opacity:0.9;font-weight:300;position:relative;z-index:1;}

/* Main container */
.container{flex:1;max-width:800px;margin:0 auto;width:100%;padding:3rem 1.5rem;position:relative;z-index:1;}

/* Auth Screen */
#auth{display:flex;flex-direction:column;gap:1.5rem;}
.auth-card{background:#fff;border:1px solid #e2e8f0;border-radius:0;padding:3rem 2rem;position:relative;overflow:hidden;}
.auth-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:4px;background:var(--blue);}

.auth-title{font-size:24px;font-weight:700;margin-bottom:1rem;letter-spacing:-0.5px;}
.auth-desc{color:var(--text-sec);font-size:14px;line-height:1.6;margin-bottom:2rem;}

.btn-group{display:flex;flex-direction:column;gap:10px;}
.btn{padding:14px 20px;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:600;letter-spacing:0.5px;transition:all .2s;border-radius:0;text-transform:uppercase;position:relative;overflow:hidden;}
.btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:rgba(255,255,255,0.2);transition:left .3s;}
.btn:hover::before{left:100%}

.btn-auth{background:var(--blue);color:#fff;border:2px solid var(--blue);}
.btn-auth:hover{background:var(--blue-dark);}

.btn-guest{background:#fff;color:var(--blue);border:2px solid var(--blue);}
.btn-guest:hover{background:var(--blue-light);}

.divider{display:flex;align-items:center;gap:1rem;margin:2rem 0;color:var(--text-sec);font-size:12px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e2e8f0;}

/* Setup Screen */
#setup{display:flex;flex-direction:column;gap:2rem;}
.setup-card{background:#fff;border:1px solid #e2e8f0;border-radius:0;padding:2.5rem;position:relative;overflow:hidden;}
.setup-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--blue);}

.card-label{display:block;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:1.5rem;}

.input-group{margin-bottom:1.5rem;}
.input-group label{display:block;font-size:12px;color:var(--text-sec);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
input[type=text]{width:100%;padding:12px 14px;border:1px solid #e2e8f0;background:#fff;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:14px;transition:all .2s;}
input[type=text]:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,0.1);}

.btn-primary{background:var(--blue);color:#fff;width:100%;}
.btn-primary:hover{background:var(--blue-dark);}

.btn-secondary{background:#fff;color:var(--blue);border:2px solid var(--blue);width:100%;}
.btn-secondary:hover{background:var(--blue-light);}

/* Player Screen */
#player{display:flex;flex-direction:column;gap:2rem;}

/* Now Playing Card */
.now-playing{background:#fff;border:1px solid #e2e8f0;border-radius:0;padding:2.5rem;position:relative;overflow:hidden;}
.now-playing::before{content:'';position:absolute;top:0;right:0;width:200px;height:200px;background:linear-gradient(135deg,rgba(37,99,235,0.05) 0%,transparent 100%);pointer-events:none;}

.np-top{display:flex;gap:2rem;align-items:flex-start;margin-bottom:2rem;position:relative;z-index:1;}
.album-art{width:140px;height:140px;background:#f1f5f9;border:2px solid #e2e8f0;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:48px;overflow:hidden;}
.album-art img{width:100%;height:100%;object-fit:cover;}

.np-info{flex:1;}
.np-title{font-size:28px;font-weight:700;letter-spacing:-1px;margin-bottom:1rem;line-height:1.2;}
.np-badges{display:flex;gap:10px;flex-wrap:wrap;}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:#f1f5f9;color:var(--blue);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
.badge.online{background:rgba(16,185,129,0.1);color:#10b981;}
.badge.guest{background:rgba(245,158,11,0.1);color:#f59e0b;}

/* Controls */
.controls{display:flex;align-items:center;gap:12px;margin:2rem 0;position:relative;z-index:1;}
.play-btn{width:56px;height:56px;border:none;background:var(--blue);color:#fff;cursor:pointer;font-size:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.play-btn:hover{background:var(--blue-dark);}

.btn-sm{width:44px;height:44px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-sec);font-size:16px;flex-shrink:0;transition:all .2s;}
.btn-sm:hover{border-color:var(--blue);color:var(--blue);}

.progress-bar{flex:1;height:6px;background:#e2e8f0;cursor:pointer;position:relative;overflow:hidden;}
.progress-fill{height:100%;background:var(--blue);width:0%;transition:width .4s linear;}

.time{font-size:12px;color:var(--text-sec);font-family:'Space Mono',monospace;min-width:50px;text-align:right;}

/* Volume Section */
.vol-section{background:#f8fafc;border:1px solid #e2e8f0;padding:1.5rem;margin:1.5rem 0;position:relative;z-index:1;}
.vol-label{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:1rem;display:flex;justify-content:space-between;}
.vol-value{font-family:'Space Mono',monospace;color:var(--blue);font-weight:700;}

.vol-slider{width:100%;height:6px;border-radius:0;background:linear-gradient(to right,var(--blue) var(--vol-pct,80%),#e2e8f0 var(--vol-pct,80%));cursor:pointer;-webkit-appearance:none;appearance:none;}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;cursor:pointer;box-shadow:0 2px 8px rgba(37,99,235,0.3);}
.vol-slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;cursor:pointer;}

.vol-presets{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:1rem;}
.vol-btn{padding:8px;background:#fff;border:1px solid #e2e8f0;color:var(--text-sec);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;}
.vol-btn:hover{border-color:var(--blue);color:var(--blue);}

/* GM Panel */
#gm-panel{display:flex;flex-direction:column;gap:2rem;}

.panel-card{background:#fff;border:1px solid #e2e8f0;border-radius:0;padding:2.5rem;position:relative;}
.panel-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:4px;background:var(--blue);}

.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;}
.panel-title{font-size:18px;font-weight:700;letter-spacing:-0.5px;}
.panel-actions{display:flex;gap:10px;}

/* Playlist */
.playlist{max-height:400px;overflow-y:auto;}
.pl-item{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #f1f5f9;cursor:pointer;transition:all .2s;}
.pl-item:hover{background:#f8fafc;}
.pl-item.active{background:var(--blue-light);}

.pl-num{width:30px;text-align:center;font-weight:600;color:var(--text-sec);font-size:12px;}
.pl-thumb{width:45px;height:45px;background:#f1f5f9;flex-shrink:0;object-fit:cover;}
.pl-name{flex:1;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pl-acts{display:flex;gap:6px;}
.pl-act{width:28px;height:28px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-sec);font-size:12px;transition:all .2s;}
.pl-act:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-light);}

/* Folders */
.folder-tabs{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap;}
.folder-tab{padding:8px 14px;background:#f8fafc;border:1px solid #e2e8f0;color:var(--text-sec);cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;}
.folder-tab:hover{border-color:var(--blue);color:var(--blue);}
.folder-tab.active{background:var(--blue);color:#fff;border-color:var(--blue);}

.folder-add{padding:8px 14px;background:#fff;border:2px dashed var(--blue);color:var(--blue);cursor:pointer;font-size:12px;font-weight:700;letter-spacing:1px;transition:all .2s;}
.folder-add:hover{background:var(--blue-light);}

/* URL Input */
.url-input-group{display:flex;gap:10px;margin-bottom:1.5rem;}
.url-input-group input{flex:1;}
.url-input-group .btn{flex:0 0 auto;}

/* Scenario */
.scenario-section{position:relative;margin-bottom:2rem;}
.upload-label{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:2rem;border:2px dashed #e2e8f0;background:#f8fafc;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-sec);transition:all .2s;}
.upload-label:hover{border-color:var(--blue);background:var(--blue-light);color:var(--blue);}
.upload-label input{display:none;}

.scenario-img-wrap{width:100%;aspect-ratio:16/9;background:#f1f5f9;border:1px solid #e2e8f0;overflow:hidden;margin-bottom:1rem;}
.scenario-img-wrap img{width:100%;height:100%;object-fit:cover;}

/* Alert */
.alert{position:fixed;bottom:2rem;right:2rem;padding:14px 20px;background:#fff;border-left:4px solid var(--blue);box-shadow:0 4px 20px rgba(0,0,0,0.1);border-radius:0;font-size:13px;font-weight:500;z-index:100;animation:slideIn .3s;}
.alert.success{border-left-color:#10b981;}
.alert.err{border-left-color:#ef4444;}
@keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}

/* Guest Panel */
#guest-panel{display:flex;flex-direction:column;gap:2rem;}
.guest-info{background:#f8fafc;border:1px solid #e2e8f0;border-left:4px solid var(--blue);padding:1.5rem;font-size:14px;line-height:1.6;color:var(--text-sec);}

/* Utilities */
.hidden{display:none!important;}
.flex1{flex:1;}
.btn-group-horizontal{display:flex;gap:10px;}
.btn-group-horizontal .btn{flex:1;}

/* Responsive */
@media(max-width:640px){
  .header{padding:3rem 1.5rem;clip-path:polygon(0 0,100% 0,100% 80%,0 100%);}
  .container{padding:2rem 1rem;}
  .setup-card,.panel-card,.now-playing{padding:1.5rem;}
  .np-top{flex-direction:column;gap:1.5rem;}
  .album-art{width:100%;height:auto;aspect-ratio:1;}
  .controls{gap:8px;}
  .btn-sm{width:40px;height:40px;}
}
</style>
</head>
<body>
<div class="pattern-bg">
  <svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="dots" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
        <circle cx="25" cy="25" r="2" fill="#2563eb"/>
      </pattern>
    </defs>
    <rect width="1000" height="1000" fill="url(#dots)"/>
  </svg>
</div>

<div class="app">
  <div class="header">
    <div class="logo">♪ BGM</div>
    <div class="subtitle">Jukebox</div>
  </div>

  <div class="container">
    <!-- AUTH SCREEN -->
    <div id="auth">
      <div class="auth-card">
        <div class="auth-title">로그인</div>
        <div class="auth-desc">GM은 로그인하여 방을 저장할 수 있습니다.<br>플레이어는 로그인 없이 참여 가능합니다.</div>
        <div class="btn-group">
          <button class="btn btn-auth" onclick="loginGoogle()">🔐 Google</button>
          <button class="btn btn-auth" onclick="loginGithub()">🔐 GitHub</button>
        </div>
        <div class="divider">또는</div>
        <button class="btn btn-guest" onclick="skipAuth()">게스트로 계속</button>
      </div>
    </div>

    <!-- SETUP SCREEN -->
    <div id="setup">
      <div id="auth-section" style="display:none;">
        <div class="setup-card">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <div>
              <div style="font-weight:600;color:var(--text);" id="user-name">로딩중...</div>
              <div style="font-size:12px;color:var(--text-sec);">GM</div>
            </div>
            <button class="btn btn-secondary" onclick="logout()" style="padding:8px 16px;font-size:12px;">로그아웃</button>
          </div>
        </div>
      </div>

      <div class="setup-card">
        <span class="card-label">👑 방 생성</span>
        <div class="input-group">
          <label>세션 이름 (선택사항)</label>
          <input type="text" id="gm-name" placeholder="">
        </div>
        <button class="btn btn-primary" onclick="createRoom()">방 생성</button>
      </div>

      <div class="setup-card">
        <span class="card-label">🎭 방 참여</span>
        <div class="url-input-group">
          <input type="text" id="join-code" placeholder="방 코드">
          <button class="btn btn-primary" onclick="joinRoom()" style="flex:0 0 auto;">입장</button>
        </div>
      </div>
    </div>

    <!-- PLAYER SCREEN -->
    <div id="player" class="hidden">
      <!-- Now Playing -->
      <div class="now-playing">
        <div class="np-top">
          <div class="album-art" id="album-art">♪</div>
          <div class="np-info">
            <div class="np-title" id="np-title">대기 중...</div>
            <div class="np-badges">
              <span id="badge-role" class="badge">👑 GM</span>
              <span id="badge-room" class="badge"></span>
              <span id="badge-online" class="badge online">● 1명</span>
            </div>
          </div>
        </div>

        <!-- Controls -->
        <div class="controls" id="gm-controls">
          <button class="play-btn" id="play-btn" onclick="togglePlay()">▶</button>
          <button class="btn-sm" onclick="prevSong()">⏮</button>
          <button class="btn-sm" onclick="nextSong()">⏭</button>
          <button class="btn-sm" id="repeat-btn" onclick="cycleRepeat()" title="반복">🔁</button>
          <div class="progress-bar" onclick="seek(event)">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <span class="time" id="time">0:00</span>
        </div>

        <!-- Volume -->
        <div class="vol-section">
          <div class="vol-label">
            <span>Volume</span>
            <span class="vol-value" id="vol-value">80%</span>
          </div>
          <input type="range" class="vol-slider" id="vol" min="0" max="100" value="80"
            oninput="setVol(this.value)" style="--vol-pct:80%">
          <div class="vol-presets">
            <button class="vol-btn" onclick="setVolTo(0)">Mute</button>
            <button class="vol-btn" onclick="setVolTo(30)">30%</button>
            <button class="vol-btn" onclick="setVolTo(60)">60%</button>
            <button class="vol-btn" onclick="setVolTo(80)">80%</button>
            <button class="vol-btn" onclick="setVolTo(100)">100%</button>
          </div>
        </div>
      </div>

      <!-- GM Panel -->
      <div id="gm-panel" class="hidden">
        <div class="panel-card">
          <div class="panel-header">
            <span class="card-label">Playlist</span>
            <div class="panel-actions">
              <button class="btn btn-secondary" onclick="copyCode()" style="padding:8px 16px;font-size:12px;">코드 복사</button>
              <button class="btn btn-secondary" onclick="leaveRoom()" style="padding:8px 16px;font-size:12px;">나가기</button>
            </div>
          </div>

          <!-- URL Input -->
          <div class="url-input-group">
            <input type="text" id="yt-url" placeholder="YouTube URL">
            <button class="btn btn-primary" onclick="addSong(true)" style="flex:0 0 auto;">재생</button>
            <button class="btn btn-secondary" onclick="addSong(false)" style="flex:0 0 auto;">추가</button>
          </div>

          <!-- Folders -->
          <div class="folder-tabs" id="folder-tabs"></div>

          <!-- Playlist -->
          <div class="playlist" id="pl-list"></div>
          <div id="pl-empty" style="text-align:center;color:var(--text-sec);padding:2rem;font-size:13px;">비어 있음. YouTube 링크를 추가해보세요!</div>
        </div>
      </div>

      <!-- Guest Panel -->
      <div id="guest-panel" class="hidden">
        <div class="guest-info">
          <strong>🎭 게스트 모드</strong><br>
          GM이 재생하는 음악이 자동으로 동기화됩니다.
        </div>
        <div class="btn-group-horizontal">
          <button class="btn btn-primary" onclick="manualSync()">지금 동기화</button>
          <button class="btn btn-secondary" onclick="leaveRoom()">나가기</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div style="position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;overflow:hidden">
  <div id="yt-player"></div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getDatabase,ref,set,onValue,get}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import{getAuth,signInWithPopup,GoogleAuthProvider,GithubAuthProvider,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const cfg={
  apiKey:"AIzaSyDpW1LqWFPaFrPBHuH1NvJA93FlyKZDleM",
  authDomain:"trpg-jukebox-d7110.firebaseapp.com",
  databaseURL:"https://trpg-jukebox-d7110-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"trpg-jukebox-d7110",
  storageBucket:"trpg-jukebox-d7110.firebasestorage.app",
  messagingSenderId:"208176725806",
  appId:"1:208176725806:web:ddb6e91604b50193fa84bf"
};
const app=initializeApp(cfg),db=getDatabase(app),auth=getAuth(app);
window._db=db;window._ref=ref;window._set=set;window._onValue=onValue;window._get=get;window._auth=auth;

let S={role:null,code:null,name:null,uid:null,userName:null,folders:[],folderIdx:0,idx:-1,playing:false,scenarioImg:null,repeat:0,vol:80,player:null,playerReady:false,lastVid:null,progressTimer:null,broadcastTimer:null,listenerRef:null};
const MOODS=[{id:'none',label:'분위기'},{id:'ambient',label:'앰비언트'},{id:'epic',label:'서사'},{id:'calm',label:'차분'},{id:'intense',label:'긴장'}];
const REPEAT={icons:['🔂','🔁','🔃'],labels:['반복 안함','전체 반복','한곡 반복']};

const $=id=>document.getElementById(id);
const curF=()=>S.folders[S.folderIdx]||{};
const curSongs=()=>curF().songs||[];
const genCode=()=>Math.random().toString(36).substring(2,8).toUpperCase();
const esc=s=>(s||'').replace(/[&<>"']/g,m=>'&#'+m.charCodeAt(0)+';');
const thumb=v=>`https://i.ytimg.com/vi/${v}/mqdefault.jpg`;
const vid=u=>{const m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]+)/);return m?m[1]:null;};

function showAlert(msg,type='info'){
  const div=document.createElement('div');
  div.className='alert '+type;
  div.textContent=msg;
  document.body.appendChild(div);
  setTimeout(()=>div.remove(),3000);
}

function waitFb(fn){
  if(window._db)fn();
  else setTimeout(()=>waitFb(fn),100);
}

onAuthStateChanged(auth,user=>{
  if(user){
    S.uid=user.uid;
    S.userName=user.displayName||user.email;
    $('auth').classList.add('hidden');
    $('auth-section').style.display='block';
    $('user-name').textContent=S.userName.split('@')[0];
    showAlert('로그인 완료!','success');
  }else{
    S.uid=null;
    S.userName=null;
    $('auth-section').style.display='none';
  }
});

async function loginGoogle(){
  try{
    const provider=new GoogleAuthProvider();
    await signInWithPopup(auth,provider);
  }catch(err){
    showAlert('로그인 실패','err');
  }
}
async function loginGithub(){
  try{
    const provider=new GithubAuthProvider();
    await signInWithPopup(auth,provider);
  }catch(err){
    showAlert('로그인 실패','err');
  }
}
async function logout(){
  try{
    await signOut(auth);
    showAlert('로그아웃 완료!','success');
  }catch(err){
    showAlert('로그아웃 실패','err');
  }
}
function skipAuth(){
  $('auth').classList.add('hidden');
  showAlert('게스트 모드로 시작합니다.','success');
}

function setVol(v){
  S.vol=parseInt(v);
  $('vol-value').textContent=S.vol+'%';
  $('vol').style.setProperty('--vol-pct',S.vol+'%');
  if(S.player&&S.playerReady)S.player.setVolume(S.vol);
}
function setVolStep(n){const v=Math.max(0,Math.min(100,S.vol+n));setVol(v);}
function setVolTo(v){setVol(v);}

async function createRoom(){
  if(!S.uid){showAlert('로그인 후 방을 생성할 수 있습니다.','err');return;}
  const name=$('gm-name').value.trim()||'새 세션';
  waitFb(async()=>{
    const code=genCode();
    const gmRoomsRef=window._ref(window._db,`users/${S.uid}/rooms/${code}`);
    const roomDataSnap=await window._get(gmRoomsRef);
    
    if(roomDataSnap.exists()){
      const data=roomDataSnap.val();
      Object.assign(S,{
        role:'gm',code,name:data.name||name,
        folders:data.folders||[{name:'기본',mood:'none',songs:[]}],
        folderIdx:data.folderIdx||0,
        idx:data.idx!=null?data.idx:-1,
        playing:data.playing||false,
        scenarioImg:data.scenarioImg||null,
        repeat:data.repeat||0
      });
    }else{
      Object.assign(S,{role:'gm',code,name,folders:[{name:'기본',mood:'none',songs:[]}],folderIdx:0,idx:-1,playing:false,scenarioImg:null,repeat:0});
      await window._set(window._ref(window._db,`rooms/${code}/meta`),{name,gm:S.uid,ts:Date.now()});
    }
    await pushState();
    enterPlayer();
  });
}
async function joinRoom(){
  const code=$('join-code').value.trim().toUpperCase();
  if(!code){showAlert('룸 코드를 입력해주세요.','err');return;}
  waitFb(async()=>{
    const snap=await window._get(window._ref(window._db,`rooms/${code}/meta`));
    if(!snap.exists()){showAlert('룸을 찾을 수 없어요.','err');return;}
    Object.assign(S,{role:'guest',code,name:snap.val().name});
    enterPlayer();startListening();
  });
}

function enterPlayer(){
  $('setup').classList.add('hidden');
  $('player').classList.remove('hidden');
  $('badge-room').textContent=S.code;
  if(S.role==='gm'){
    $('badge-role').textContent='👑 GM';
    $('gm-panel').classList.remove('hidden');
    $('guest-panel').classList.add('hidden');
    $('gm-controls').style.display='flex';
    renderFolders();renderPl();initYT();startBroadcast();
  }else{
    $('badge-role').textContent='🎭 플레이어';
    $('gm-panel').classList.add('hidden');
    $('guest-panel').classList.remove('hidden');
    $('gm-controls').style.display='none';
    initYT();
  }
}

function leaveRoom(){
  if(S.broadcastTimer)clearInterval(S.broadcastTimer);
  if(S.progressTimer)clearInterval(S.progressTimer);
  if(S.listenerRef)S.listenerRef();
  Object.assign(S,{role:null,code:null,player:null,playerReady:false});
  $('player').classList.add('hidden');
  $('setup').classList.remove('hidden');
  $('gm-name').value='';
  $('join-code').value='';
  $('yt-player').innerHTML='';
}
function copyCode(){navigator.clipboard.writeText(S.code).then(()=>{showAlert('코드 복사됨!','success');}).catch(()=>prompt('코드:',S.code));}

async function pushState(){
  if(!S.code||S.role!=='gm')return;
  const t=S.player&&S.playerReady&&S.player.getCurrentTime?S.player.getCurrentTime():0;
  const songs=curSongs();
  const stateData={
    folders:S.folders,folderIdx:S.folderIdx,idx:S.idx,
    playing:S.playing,repeat:S.repeat,
    vid:songs[S.idx]?.vid||null,
    mood:curF().mood||'none',
    scenarioImg:S.scenarioImg||null,
    seekTo:t,ts:Date.now()
  };
  await window._set(window._ref(window._db,`rooms/${S.code}/state`),stateData);
  if(S.uid)await window._set(window._ref(window._db,`users/${S.uid}/rooms/${S.code}`),stateData);
}
function startBroadcast(){if(S.broadcastTimer)clearInterval(S.broadcastTimer);S.broadcastTimer=setInterval(pushState,2500);}

function renderFolders(){
  $('folder-tabs').innerHTML=S.folders.map((f,i)=>`<button class="folder-tab ${i===S.folderIdx?'active':''}" onclick="switchFolder(${i})">${esc(f.name)}</button>`).join('')+`<button class="folder-add" onclick="addFolder()">+ 새 폴더</button>`;
}
function switchFolder(i){S.folderIdx=i;S.idx=-1;renderFolders();renderPl();}
function addFolder(){const n=prompt('폴더 이름:','새 폴더');if(!n)return;S.folders.push({name:n,mood:'none',songs:[]});S.folderIdx=S.folders.length-1;renderFolders();renderPl();pushState();}
function deleteFolder(i){if(S.folders.length<=1){showAlert('마지막 폴더는 삭제할 수 없어요.','err');return;}if(!confirm(`"${S.folders[i].name}" 폴더를 삭제할까요?`))return;S.folders.splice(i,1);S.folderIdx=Math.min(S.folderIdx,S.folders.length-1);S.idx=-1;renderFolders();renderPl();pushState();}

function renderPl(){
  const songs=curSongs(),list=$('pl-list'),empty=$('pl-empty');
  if(!songs.length){list.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  list.innerHTML=songs.map((s,i)=>`
    <div class="pl-item ${i===S.idx?'active':''}" onclick="playSong(${i})">
      <span class="pl-num">${i===S.idx&&S.playing?'▶':i+1}</span>
      <img class="pl-thumb" src="${thumb(s.vid)}" onerror="this.style.display='none'">
      <span class="pl-name">${esc(s.title)}</span>
      <div class="pl-acts">
        <button class="pl-act" onclick="event.stopPropagation();editTitle(${i})">✏️</button>
        <button class="pl-act" onclick="event.stopPropagation();removeSong(${i})">✕</button>
      </div>
    </div>`).join('');
}
function editTitle(i){const songs=curSongs(),inp=prompt('제목:',songs[i].title);if(!inp)return;songs[i].title=inp.trim();renderPl();pushState();}
function addSong(playNow){const url=$('yt-url').value.trim(),v=vid(url);if(!v){showAlert('유효한 YouTube URL을 입력해주세요.','err');return;}const songs=curSongs();songs.push({url,vid:v,title:`트랙 ${songs.length+1}`});$('yt-url').value='';renderPl();if(playNow||S.idx===-1)playSong(songs.length-1);else pushState();}
function removeSong(i){const songs=curSongs();songs.splice(i,1);if(S.idx>=i)S.idx=Math.max(-1,S.idx-1);renderPl();pushState();}
function playSong(i){const songs=curSongs();if(i<0||i>=songs.length)return;S.idx=i;S.playing=true;const s=songs[i];S.lastVid=s.vid;$('np-title').textContent=s.title;$('album-art').innerHTML=`<img src="${thumb(s.vid)}" style="width:100%;height:100%;object-fit:cover;">`;updatePlayBtn(true);renderPl();if(S.player&&S.playerReady){S.player.loadVideoById(s.vid);S.player.setVolume(S.vol);}pushState();}
function togglePlay(){if(!S.player||!S.playerReady)return;if(S.playing){S.player.pauseVideo();S.playing=false;updatePlayBtn(false);}else{S.player.playVideo();S.playing=true;updatePlayBtn(true);}pushState();}
function updatePlayBtn(p){$('play-btn').textContent=p?'⏸':'▶';}
function prevSong(){if(S.idx>0)playSong(S.idx-1);}
function nextSong(){const songs=curSongs();if(!songs.length)return;if(S.repeat===2){playSong(S.idx);return;}if(S.idx<songs.length-1)playSong(S.idx+1);else if(S.repeat===1)playSong(0);}
function cycleRepeat(){S.repeat=(S.repeat+1)%3;const btn=$('repeat-btn');btn.textContent=REPEAT.icons[S.repeat];btn.classList.toggle('on',S.repeat>0);pushState();}
function seek(e){if(!S.player||!S.playerReady)return;const dur=S.player.getDuration?S.player.getDuration():0;if(!dur)return;const r=e.currentTarget.getBoundingClientRect();S.player.seekTo(dur*(e.clientX-r.left)/r.width,true);}

function startProgress(){
  if(S.progressTimer)clearInterval(S.progressTimer);
  S.progressTimer=setInterval(()=>{
    if(!S.player||!S.playerReady)return;
    try{const c=S.player.getCurrentTime?S.player.getCurrentTime():0,d=S.player.getDuration?S.player.getDuration():0;if(d>0){$('progress-fill').style.width=(c/d*100)+'%';const m=Math.floor(c/60),s=Math.floor(c%60);$('time').textContent=m+':'+(s<10?'0':'')+s;}}catch(e){}
  },500);
}

let ytLoaded=false;
function initYT(){if(ytLoaded){createYTPlayer();return;}window.onYouTubeIframeAPIReady=()=>{ytLoaded=true;createYTPlayer();};const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';document.head.appendChild(sc);}
function createYTPlayer(){
  if(S.player)return;
  const el=$('yt-player');el.innerHTML='';
  const div=document.createElement('div');div.id='yti';el.appendChild(div);
  S.player=new YT.Player('yti',{
    height:'1',width:'1',playerVars:{autoplay:1,controls:0,rel:0},
    events:{
      onReady:(e)=>{S.playerReady=true;e.target.setVolume(S.vol);startProgress();if(S.role==='guest')startListening();},
      onStateChange:(e)=>{if(e.data===YT.PlayerState.ENDED&&S.role==='gm')nextSong();}
    }
  });
}

function startListening(){
  if(S.listenerRef)S.listenerRef();
  S.listenerRef=window._onValue(window._ref(window._db,`rooms/${S.code}/state`),snap=>{
    if(!snap.exists())return;
    const d=snap.val(),age=Date.now()-d.ts;
    S.folders=d.folders||S.folders;
    S.folderIdx=d.folderIdx||0;
    if(S.role==='guest')renderPl();

    const songs=curSongs();
    if(d.vid){
      $('np-title').textContent=songs[d.idx]?.title||'재생 중';
      $('album-art').innerHTML=`<img src="${thumb(d.vid)}" style="width:100%;height:100%;object-fit:cover;">`;
      if(S.player&&S.playerReady){
        if(d.vid!==S.lastVid){
          S.lastVid=d.vid;S.player.loadVideoById(d.vid);
          const tgt=d.seekTo+(age/1000);
          setTimeout(()=>{if(S.player.seekTo)S.player.seekTo(tgt,true);},800);
          if(!d.playing)setTimeout(()=>S.player.pauseVideo(),1000);
        }else{
          const lt=S.player.getCurrentTime?S.player.getCurrentTime():0,st=d.seekTo+(age/1000);
          if(Math.abs(lt-st)>3)S.player.seekTo(st,true);
          const ps=S.player.getPlayerState?S.player.getPlayerState():-1;
          if(d.playing&&ps!==1)S.player.playVideo();
          else if(!d.playing&&ps===1)S.player.pauseVideo();
        }
      }
    }else{
      $('np-title').textContent='대기 중...';
      $('album-art').textContent='♪';
    }
  });
}
function manualSync(){if(S.listenerRef)S.listenerRef();startListening();showAlert('동기화 완료!','success');}
</script>
